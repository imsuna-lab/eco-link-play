<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b4e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>ECO-LINK PLAY · 설치 테스트</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0f7f2;color:#193c30;font-family:system-ui,sans-serif;padding:24px}main{width:min(100%,460px);background:#fff;border:1px solid #dce8df;border-radius:28px;padding:32px;text-align:center;box-shadow:0 16px 60px #193c300d}img{width:100px;height:100px}h1{font-size:29px;margin:18px 0 8px}p{line-height:1.65;color:#4b6759}small{font-size:13px;color:#4b6759}button{width:100%;padding:15px;border:0;border-radius:12px;background:#176b4e;color:white;font:inherit;font-weight:700;cursor:pointer}button[hidden]{display:none}aside{text-align:left;border-radius:12px;padding:16px;background:#f0f7f2;font-size:14px;line-height:1.65;margin:18px 0}</style></head><body><main><img src="./icon.svg" alt=""><h1>ECO-LINK PLAY</h1><small>청소년 환경교육 게임 · 설치 테스트</small><p>앱 설치 및 실행 화면을 확인하는 준비 버전입니다. 기존 게임 및 공동 랭킹은 아직 연결되지 않았습니다.</p><button id="install" hidden>홈 화면에 설치</button><aside>Android: Chrome 메뉴 → 홈 화면에 추가 또는 앱 설치<br>iPhone/iPad: Safari 공유 → 홈 화면에 추가</aside><small id="status" role="status">설치 환경 확인 중</small></main><script>let pending;const b=document.getElementById('install'),s=document.getElementById('status');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e;b.hidden=false;});b.onclick=async()=>{if(!pending)return;await pending.prompt();pending=null;b.hidden=true;};window.addEventListener('appinstalled',()=>{b.hidden=true;s.textContent='앱 설치 완료';});if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){s.textContent='독립 실행 모드';}else{s.textContent='브라우저 메뉴에서 설치할 수 있습니다.';}if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{s.textContent='서비스 워커 등록 실패: 브라우저에서 다시 확인해 주세요.';});</script></body></html>
