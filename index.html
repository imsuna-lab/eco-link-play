<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b4e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest?v=4"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>ECO-LINK PLAY</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0f7f2;color:#193c30;font-family:system-ui,sans-serif;padding:24px}main{width:min(100%,460px);background:#fff;border:1px solid #dce8df;border-radius:28px;padding:32px;text-align:center;box-shadow:0 16px 60px #193c300d}img{width:100px;height:100px}h1{font-size:29px;margin:18px 0 8px}p{line-height:1.65;color:#4b6759}small{font-size:13px;color:#4b6759}button{width:100%;padding:15px;border:0;border-radius:12px;background:#176b4e;color:white;font:inherit;font-weight:700;cursor:pointer}button[hidden]{display:none}.launch{display:block;text-decoration:none;background:#176b4e;color:white;border-radius:12px;padding:15px;font-weight:700;margin:20px 0 10px}#install{background:#e3f3e9;color:#176b4e}aside{text-align:left;border-radius:12px;padding:16px;background:#f0f7f2;font-size:14px;line-height:1.65;margin:18px 0}</style></head><body><main><img src="./icon.svg" alt=""><h1>ECO-LINK PLAY</h1><small>청소년 환경교육 게임</small><p>환경을 배우는 새로운 방법, PLAY! 기존 게임과 기관별 공동 랭킹을 이용할 수 있습니다.</p><a class="launch" href="https://script.google.com/macros/s/AKfycbxZMWwqfZAd65Tor5DsbXvObIIkAUsjpJj5zaB1tcWl1WLsQmmmYrQLQVlmNv7M_ka1/exec" rel="noopener noreferrer">게임 시작하기</a><button id="install" hidden>홈 화면에 설치</button><aside>게임 시작을 누르면 기존 게임 사이트로 이동합니다. 인터넷 연결이 필요하며 기기에 따라 브라우저에서 열릴 수 있습니다.<br><br>Android: Chrome 메뉴 → 홈 화면에 추가 또는 앱 설치<br>iPhone/iPad: Safari 공유 → 홈 화면에 추가</aside><small id="status" role="status">설치 환경 확인 중</small></main><script>let pending;const b=document.getElementById('install'),s=document.getElementById('status');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e;b.hidden=false;});b.onclick=async()=>{if(!pending)return;await pending.prompt();pending=null;b.hidden=true;};window.addEventListener('appinstalled',()=>{b.hidden=true;s.textContent='앱 설치 완료';});const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(standalone){b.hidden=true;document.querySelector('aside').textContent='게임이 자동으로 열리지 않으면 위 버튼을 눌러 주세요. 인터넷 연결이 필요합니다.';s.textContent='게임을 불러오는 중…';if(navigator.onLine&&!history.state?.ecoLinkAutoOpened){setTimeout(()=>{if(!navigator.onLine){s.textContent='인터넷 연결을 확인해 주세요.';return;}history.replaceState({...history.state,ecoLinkAutoOpened:true},'');s.textContent='게임 시작하기 버튼으로 다시 접속할 수 있습니다.';location.assign(document.querySelector('.launch').href);},350);}else{s.textContent=navigator.onLine?'게임 시작하기 버튼으로 다시 접속할 수 있습니다.':'인터넷 연결을 확인해 주세요.';}}else{s.textContent='설치 버튼이 보이지 않으면 Chrome 메뉴(⋮)에서 홈 화면에 추가 또는 앱 설치를 선택하세요.';}if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{s.textContent='서비스 워커 등록 실패: 브라우저에서 다시 확인해 주세요.';});</script></body></html>
